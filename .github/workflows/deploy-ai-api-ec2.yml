name: Deploy AI API to EC2

on:
  push:
    branches:
      - main
    paths:
      - "ai-backend/**"
      - ".github/workflows/deploy-ai-api-ec2.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/intellifone-key.pem
          chmod 600 ~/.ssh/intellifone-key.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/intellifone-key.pem "$EC2_USER@$EC2_HOST" << 'EOF'
            set -euo pipefail

            cd /home/ubuntu/IntelliFone
            git pull origin main

            cd ai-backend
            source .venv/bin/activate
            pip install -r requirements.ai-backend.txt
            python -m compileall main_api.py

            sudo systemctl restart intellifone-ai-api
            sleep 5
            curl -fsS http://127.0.0.1:8000/health
          EOF
