name: Deploy AI API to EC2

on:
  push:
    branches:
      - main
    paths:
      - "ai-backend/**"
      - ".github/workflows/deploy-ai-api-ec2.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/intellifone-key.pem
          chmod 600 ~/.ssh/intellifone-key.pem

          HOST="$(printf '%s' "$EC2_HOST" | tr -d '[:space:]')"
          HOST="${HOST#http://}"
          HOST="${HOST#https://}"
          HOST="${HOST#*@}"
          HOST="${HOST%%/*}"
          HOST="${HOST%%:*}"

          USERNAME="$(printf '%s' "$EC2_USER" | tr -d '[:space:]')"
          USERNAME="${USERNAME%@*}"
          USERNAME="${USERNAME:-ubuntu}"

          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/intellifone-key.pem "$USERNAME@$HOST" << 'EOF'
            set -euo pipefail

            cd /home/ubuntu/IntelliFone
            git pull origin main

            cd ai-backend
            source .venv/bin/activate
            pip install --no-cache-dir -r requirements.ai-backend.txt
            python -m compileall main_api.py

            sudo systemctl restart intellifone-ai-api

            for attempt in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8000/health; then
                echo "API health check passed"
                exit 0
              fi

              echo "Waiting for API to become healthy... attempt ${attempt}/30"
              sleep 2
            done

            echo "API did not become healthy in time. Recent service logs:"
            sudo systemctl status intellifone-ai-api --no-pager || true
            sudo journalctl -u intellifone-ai-api -n 120 --no-pager || true
            exit 1
          EOF
